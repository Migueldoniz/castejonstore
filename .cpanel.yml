---
deployment:
  # Deploy por BRANCH (arquivo IDENTICO em staging e production - nunca conflita no merge).
  tasks:
    - export BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
    - if [ "$BRANCH" = "production" ]; then export DEPLOYPATH=/home/caste3874526/public_html/wp-content/themes/castejon-theme/; elif [ "$BRANCH" = "staging" ]; then export DEPLOYPATH=/home/caste3874526/staging.castejonstore.com.br/wp-content/themes/castejon-theme/; else echo "ERRO - branch $BRANCH sem mapeamento. Abortando."; exit 1; fi
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R * "$DEPLOYPATH"
    - echo "Deploy OK - branch $BRANCH -> $DEPLOYPATH"
